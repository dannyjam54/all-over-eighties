
media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image]

content:
  - name: gigs
    label: Gig Dates
    type: file
    path: data/gigs.json
    format: json
    list: true
    fields:
      - name: date
        label: Gig date
        type: date
      - name: venue
        label: Venue
        type: string
      - name: location
        label: Town / location
        type: string
      - name: time
        label: Start time
        type: string
      - name: ticket_url
        label: Ticket link
        type: string
      - name: details
        label: Gig details
        type: text
      - name: poster
        label: Gig poster
        type: image

  - name: gallery
    label: Gallery Photos
    type: file
    path: data/gallery.json
    format: json
    fields:
      - name: image
        label: Photo
        type: image
      - name: caption
        label: Caption
        type: string
      - name: date
        label: Date
        type: date

  - name: news
    label: Band News
    type: file
    path: data/news.json
    format: json
    fields:
      - name: date
        label: Date
        type: date
      - name: title
        label: Headline
        type: string
      - name: body
        label: Announcement
        type: text
      - name: image
        label: Photo
        type: image

  - name: videos
    label: Videos
    type: file
    path: data/videos.json
    format: json
    list: true
    fields:
      - name: title
        label: Video title
        type: string
        required: true
      - name: youtube_url
        label: YouTube video URL
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: category
        label: Category (Live / Promo / Behind the scenes)
        type: string
      - name: date
        label: Date (optional)
        type: date
